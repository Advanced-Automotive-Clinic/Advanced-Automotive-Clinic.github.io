<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ==========================================================================
       TODO: replace these to match your shop. These are STATIC on purpose —
       search engines and link previews read them without running JavaScript,
       so they can't come from site.config.js.
       ======================================================================= -->
  <title>Advanced Automotive Clinic — Auto Repair in Brandywine, MD</title>
  <meta name="description"
    content="Independent auto repair shop on Crain Highway in Brandywine, Maryland. Diagnostics, brakes, engine repair, A/C, and Maryland state inspections for domestic and import vehicles.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Advanced Automotive Clinic — Auto Repair in Brandywine, MD">
  <meta property="og:description"
    content="Independent auto repair in Brandywine, Maryland. Bring it in sick, drive it home well.">
  <meta name="theme-color" content="#f7f9fa">

  <!-- Tab icon: the red "A" and speed lines lifted from the shop's logo. The
       full logo lockup is three stacked lines of text and is unreadable at
       16px, so the favicon uses its most recognisable fragment instead. -->
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header ============================================================== -->
  <header class="site-header" data-header>
    <div class="shell site-header__inner">
      <a class="brand" href="#top">
        <!-- <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 20h24M7 20l2.5-7.5A3 3 0 0 1 12.3 10h7.4a3 3 0 0 1 2.8 2.5L25 20" />
            <circle cx="10.5" cy="23" r="2.5" />
            <circle cx="21.5" cy="23" r="2.5" />
          </svg>
        </span> -->
        <span class="brand__text" data-field="shop-name">&nbsp;</span>
        <!-- Swapped in by main.js when images.logo is set. The text name above
             is then hidden visually but kept for screen readers. -->
        <img class="brand__logo" data-field="brand-logo" alt="" hidden>
      </a>

      <a class="header-phone" data-field="header-phone" href="#location">
        <svg class="header-phone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
        </svg>
        <span data-field="header-phone-text"></span>
      </a>
    </div>
  </header>

  <!-- Status banner — rendered entirely by main.js from config.status ====== -->
  <div id="status-banner" role="status" aria-live="polite"></div>

  <main id="main">
    <span id="top"></span>

    <!-- Hero ============================================================== -->
    <section class="hero">
      <div class="shell hero__inner">
        <div class="hero__copy">
          <p class="hero__eyebrow" data-field="hero-location"></p>
          <h1 class="hero__title" data-field="hero-name">&nbsp;</h1>
          <p class="hero__tagline" data-field="hero-tagline"></p>

          <!-- No phone number here on purpose: it lives in the sticky header,
               which stays on screen anyway, so repeating it is noise. -->
          <div class="hero__meta">
            <span class="open-pill" data-field="open-pill" hidden>
              <span class="open-pill__dot" aria-hidden="true"></span>
              <span data-field="open-pill-text"></span>
            </span>
          </div>
        </div>

        <!-- Populated by main.js from images.hero. width/height are set on the
             img so the browser reserves the space before the photo arrives and
             nothing jumps around as it loads. -->
        <figure class="hero__media" data-field="hero-media" hidden></figure>
      </div>
    </section>

    <!-- Services ========================================================== -->
    <section class="section" id="services" data-section="services" hidden>
      <div class="shell">
        <h2 class="section__title">What we work on</h2>
        <p class="section__lede">
          General repair and maintenance for most domestic and import vehicles.
        </p>
        <ul class="service-grid" data-field="services"></ul>
      </div>
    </section>

    <!-- About ============================================================= -->
    <section class="section section--alt" id="about" data-section="about" hidden>
      <div class="shell about">
        <div class="about__copy">
          <h2 class="section__title" data-field="about-heading"></h2>
          <div data-field="about-body"></div>
        </div>
        <ul class="stat-grid" data-field="about-stats"></ul>
      </div>
    </section>

    <!-- Updates =========================================================== -->
    <section class="section" id="updates" data-section="updates" hidden>
      <div class="shell">
        <h2 class="section__title">Shop updates</h2>
        <p class="section__lede">Announcements and schedule changes, most recent first.</p>
        <ol class="update-list" data-field="updates"></ol>
      </div>
    </section>

    <!-- Hours &amp; location ================================================== -->
    <section class="section section--alt" id="location">
      <div class="shell">
        <h2 class="section__title">Hours &amp; location</h2>
        <div class="location">
          <div class="location__col">
            <h3 class="location__subtitle">Hours</h3>
            <table class="hours-table">
              <caption class="sr-only">Opening hours by day of the week</caption>
              <tbody data-field="hours"></tbody>
            </table>
            <p class="hours-note" data-field="hours-note"></p>
          </div>

          <div class="location__col">
            <h3 class="location__subtitle">Find us</h3>
            <address class="contact" data-field="contact"></address>
            <div class="map" data-field="map" hidden></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer ============================================================== -->
  <footer class="site-footer">
    <div class="shell site-footer__inner">
      <p class="site-footer__name" data-field="footer-name"></p>
      <p class="site-footer__legal" data-field="footer-legal"></p>
    </div>
  </footer>

  <!-- ==========================================================================
       NO-SCRIPT FALLBACK

       This is the ONE place content is duplicated from site.config.js. It exists
       so the page is still usable with JavaScript disabled, and so crawlers that
       don't execute scripts still find the core contact details.

       It intentionally carries only near-static information — name, phone,
       address, hours. It never carries the status notice, because a stale status
       is worse than no status.

       TODO: if you change the shop name, phone, address, or hours in
       site.config.js, update the copy below to match.
       ======================================================================= -->
  <noscript>
    <div class="noscript">
      <div class="shell">
        <h2>Advanced Automotive Clinic</h2>
        <p>Bring it in sick, drive it home well.</p>
        <p>
          <strong>Phone:</strong> <a href="tel:+13017827778">(301) 782-7778</a><br>
          <strong>Address:</strong> 14806 Crain Hwy, Brandywine, MD 20613
        </p>
        <p>
          <strong>Hours:</strong><br>
          Monday&ndash;Friday: 8:30am &ndash; 6:00pm<br>
          Saturday: 8:30am &ndash; 1:00pm<br>
          Sunday: Closed
        </p>
        <p>
          Please call the shop for current availability &mdash; it may differ from
          the hours listed above.
        </p>
      </div>
    </div>
  </noscript>

  <script src="site.config.js"></script>
  <script src="main.js"></script>
</body>

</html>
